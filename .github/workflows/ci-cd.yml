# CI/CD
#
#   pull request  →  test + bundle validate                  (CI)
#   push to main  →  test → deploy+run STAGE → deploy+run PROD (CD)
#
# Production is only ever written by this workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DATABRICKS_HOST   https://<your-workspace>.cloud.databricks.com
#   DATABRICKS_TOKEN  token used for deployment. In a company this belongs
#                     to a service principal, not to a person.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  validate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t stage
      - run: databricks bundle validate -t prod

  deploy-stage:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t stage
      # Runs pipeline + checks on stage data. If anything fails, prod is not touched.
      - run: databricks bundle run -t stage medallion_scd_job

  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    # Add "required reviewers" to this environment in GitHub for a manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run -t prod medallion_scd_job
